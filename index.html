<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Kitchen VR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#111;touch-action:none}
canvas{display:block;touch-action:none}
#top{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.pill,.topbtn{pointer-events:auto;border:0;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 5px 18px #0004}
.pill{background:#fff;color:#222}.topbtn{color:#fff;background:#2456b8}.green{background:#15803d}.score{background:#fff;font-size:18px;color:#111}
#challengePanel{position:fixed;z-index:9;top:78px;left:50%;transform:translateX(-50%);background:#ffffffee;color:#18212b;border-radius:18px;padding:12px 18px;text-align:center;max-width:88vw;min-width:260px;box-shadow:0 10px 30px #0005}
.small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.65;font-weight:800}.task{font-size:19px;font-weight:900;margin:3px 0 9px}.next{border:0;border-radius:11px;padding:9px 14px;font-weight:900;background:#2456b8;color:#fff}.hidden{display:none!important}
#controls{position:fixed;z-index:11;left:16px;bottom:16px;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:52px 52px 52px;gap:7px}.move{border:0;border-radius:15px;background:#ffffffe8;color:#18212b;font-size:25px;font-weight:900;box-shadow:0 6px 18px #0004;touch-action:none}.move:active{transform:scale(.95);background:#dcecff}.blank{visibility:hidden}
#help{position:fixed;z-index:8;left:50%;bottom:17px;transform:translateX(-50%);background:#18212bdd;color:#fff;border-radius:14px;padding:10px 14px;font-size:12px;font-weight:700;max-width:62vw;text-align:center;pointer-events:none}
#teacherPanel{position:fixed;z-index:12;top:70px;right:14px;background:#18212bf5;color:#fff;padding:15px;border-radius:16px;box-shadow:0 10px 30px #0006}.level{border:0;border-radius:10px;padding:9px 12px;margin:4px;font-weight:800}
#vrMode{position:fixed;inset:0;z-index:7;pointer-events:none;border:3px solid #59ff7a;display:none}.vr #vrMode{display:block}.vr #help{display:none}.vr #controls{opacity:.72}
@media(max-width:600px){#top{top:8px;left:8px;right:8px}.topbtn,.pill{padding:8px 10px;font-size:12px}#challengePanel{top:66px}.task{font-size:17px}#help{bottom:8px;max-width:58vw}.move{width:56px;height:50px}}
</style>
</head>
<body>
<div id="top"><button id="challenge" class="topbtn">🎯 Challenge</button><button id="teacher" class="topbtn green">👩‍🏫 Teacher</button><button id="vr" class="topbtn">🥽 VR</button><span id="score" class="pill score">⭐ 0</span></div>
<div id="challengePanel" class="hidden"><div class="small">English Challenge</div><div id="taskText" class="task">Open the refrigerator</div><button id="next" class="next hidden">Next task ▶</button></div>
<div id="teacherPanel" class="hidden"><b>Teacher Mode</b><div style="font-size:12px;opacity:.75;margin:4px 0 8px">Choose challenge difficulty</div><button class="level" data-level="Easy">Easy</button><button class="level" data-level="Medium">Medium</button><button class="level" data-level="Hard">Hard</button></div>
<div id="controls"><span class="blank"></span><button class="move" data-move="forward">▲</button><span class="blank"></span><button class="move" data-move="left">◀</button><button class="move" data-move="back">▼</button><button class="move" data-move="right">▶</button></div>
<div id="help">☝️ Drag with one finger to look around • Use the arrows to move • Tap an appliance to interact</div><div id="vrMode"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7d8);scene.fog=new THREE.Fog(0x9ec7d8,9,30);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,5.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b6258,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,7,3);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.55,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const wood=mat(0x9b6238,.8),cream=mat(0xe7d9bd,.9),white=mat(0xf1f1ed,.65),steel=mat(0x777b80,.3,.5),dark=mat(0x25282a,.55),red=mat(0xc94a3d,.75),yellow=mat(0xe8b84b,.75),green=mat(0x4c8b55,.8),glass=new THREE.MeshPhysicalMaterial({color:0x9bd0e8,transparent:true,opacity:.28,roughness:.1});
function box(x,y,z,w,h,d,ma){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);b.position.y=h/2;b.castShadow=b.receiveShadow=true;g.add(b);g.position.set(x,y,z);return g}
function cyl(x,y,z,r,h,ma){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),ma);m.position.set(x,y+h/2,z);m.castShadow=true;return m}
scene.add(box(0,-.1,0,12,.2,10,wood));scene.add(box(0,2.9,-5,12,6,.2,cream));scene.add(box(-5.9,1.5,0,.2,3,10,cream));scene.add(box(5.9,1.5,0,.2,3,10,cream));
scene.add(box(-3.9,1,-4.2,3.2,1.8,.8,wood));scene.add(box(-1.1,1,-4.2,2.2,1.8,.8,wood));scene.add(box(1.4,1,-4.2,2.5,1.8,.8,wood));
const fridge=box(-4.2,0,-2.5,1.45,2.8,1.15,steel);scene.add(fridge);let fridgeOpen=false;const fridgeDoor=box(-3.45,.2,-2.5,.08,2.45,1.05,steel);scene.add(fridgeDoor);fridgeDoor.userData.action='fridge';
scene.add(box(-1.5,.2,-3.65,1.65,2,.85,steel));const ovenGlass=box(-1.5,.58,-3.2,1.35,.72,.06,glass);scene.add(ovenGlass);ovenGlass.userData.action='oven';for(let i=0;i<4;i++)scene.add(cyl(-1.95+i*.3,2.25,-3.65,.1,.035,dark));let ovenOn=false;
const micro=box(.35,1.55,-3.68,1.15,.72,.72,dark);scene.add(micro);micro.userData.action='microwave';scene.add(box(.35,1.63,-3.28,.82,.48,.03,glass));let microOn=false;
scene.add(box(2.25,.2,-3.55,1.55,1.55,.82,white));const dishDoor=box(2.25,.85,-3.12,1.38,.65,.06,steel);scene.add(dishDoor);dishDoor.userData.action='dishwasher';let dishOpen=false;
const coffee=box(3.75,.2,-3.65,.85,1.35,.7,dark);scene.add(coffee);coffee.userData.action='coffee';scene.add(cyl(3.75,1.35,-3.65,.22,.12,steel));let coffeeOn=false;
scene.add(box(0,.92,.7,3.3,.16,1.65,wood));for(const x of [-1.45,1.45])for(const z of [.05,1.35])scene.add(cyl(x,.05,z,.09,.9,dark));
function fruit(x,z,c,r=.115){scene.add(cyl(x,1.08,z,r,.16,mat(c,.8)));}fruit(-.55,.7,red);fruit(0,.7,yellow);fruit(.55,.7,green);fruit(-.25,1,red);fruit(.3,1,yellow);
scene.add(cyl(-3.8,.45,-3.7,.18,.25,steel));scene.add(cyl(-3.25,.45,-3.7,.18,.25,steel));scene.add(box(-2.6,.35,-3.7,.45,.18,.35,cream));for(let i=0;i<5;i++)scene.add(cyl(2.8+i*.28,.45,-3.75,.08,.25,steel));
let score=0;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function interact(a){
 if(a==='fridge'){fridgeOpen=!fridgeOpen;fridgeDoor.position.x=fridgeOpen?-2.9:-3.45;say(fridgeOpen?'Open refrigerator':'Close refrigerator')}
 if(a==='oven'){ovenOn=!ovenOn;say(ovenOn?'Turn on oven':'Turn off oven')}
 if(a==='microwave'){microOn=!microOn;say(microOn?'Turn on microwave':'Turn off microwave')}
 if(a==='dishwasher'){dishOpen=!dishOpen;dishDoor.rotation.x=dishOpen?-1.15:0;say(dishOpen?'Open dishwasher':'Close dishwasher')}
 if(a==='coffee'){coffeeOn=!coffeeOn;say(coffeeOn?'Make coffee':'Stop coffee')}
 finish();
}
const tasks=[['Open the refrigerator',()=>fridgeOpen],['Close the refrigerator',()=>!fridgeOpen],['Turn on the oven',()=>ovenOn],['Turn off the oven',()=>!ovenOn],['Turn on the microwave',()=>microOn],['Turn off the microwave',()=>!microOn],['Make coffee',()=>coffeeOn],['Open the dishwasher',()=>dishOpen],['Close the dishwasher',()=>!dishOpen]];let ti=0,active=false,done=false;
function startChallenge(){active=true;done=false;document.getElementById('challengePanel').classList.remove('hidden');document.getElementById('next').classList.add('hidden');document.getElementById('taskText').textContent=tasks[ti%tasks.length][0];say(tasks[ti%tasks.length][0])}
function finish(){if(active&&!done&&tasks[ti%tasks.length][1]()){done=true;score+=2;document.getElementById('score').textContent='⭐ '+score;document.getElementById('taskText').textContent='✅ Great job!';document.getElementById('next').classList.remove('hidden');say('Great job!')}}
document.getElementById('challenge').onclick=startChallenge;document.getElementById('next').onclick=()=>{ti++;startChallenge()};document.getElementById('teacher').onclick=()=>document.getElementById('teacherPanel').classList.toggle('hidden');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{say(b.dataset.level+' level selected');document.getElementById('teacherPanel').classList.add('hidden')});
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();
function raycastTap(x,y){const r=renderer.domElement.getBoundingClientRect();pt.x=((x-r.left)/r.width)*2-1;pt.y=-((y-r.top)/r.height)*2+1;ray.setFromCamera(pt,camera);const hits=ray.intersectObjects(scene.children,true);for(const h of hits){if(h.object.userData.action){interact(h.object.userData.action);break}}}
let dragging=false,lastX=0,lastY=0,startX=0,startY=0,startTime=0,yaw=0,pitch=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();dragging=true;lastX=startX=e.clientX;lastY=startY=e.clientY;startTime=performance.now()});
window.addEventListener('pointermove',e=>{if(!dragging||e.target!==renderer.domElement)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;yaw-=dx*.004;pitch-=dy*.003;pitch=Math.max(-.8,Math.min(.8,pitch));lastX=e.clientX;lastY=e.clientY});
window.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const moved=Math.hypot(e.clientX-startX,e.clientY-startY);if(e.target===renderer.domElement&&moved<8&&performance.now()-startTime<450)raycastTap(e.clientX,e.clientY)});
const move={forward:false,back:false,left:false,right:false};document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;const on=e=>{e.preventDefault();e.stopPropagation();move[k]=true};const off=e=>{e.preventDefault();e.stopPropagation();move[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
let vr=false;document.getElementById('vr').onclick=async()=>{vr=!vr;document.body.classList.toggle('vr',vr);if(vr&&document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen()}catch(e){}}document.getElementById('vr').textContent=vr?'🥽 Exit VR':'🥽 VR'};
function loop(){requestAnimationFrame(loop);const speed=.045;let dx=0,dz=0;if(move.forward)dz-=speed;if(move.back)dz+=speed;if(move.left)dx-=speed;if(move.right)dx+=speed;camera.position.x+=dx;camera.position.z+=dz;camera.position.x=Math.max(-5.2,Math.min(5.2,camera.position.x));camera.position.z=Math.max(-4.4,Math.min(4.4,camera.position.z));camera.rotation.set(pitch,yaw,0,'YXZ');renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
