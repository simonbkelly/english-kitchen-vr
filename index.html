<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>English Kitchen VR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;top:12px;left:12px;right:12px;z-index:4;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#000b;padding:10px 14px;border-radius:14px}.title{font-weight:bold;font-size:18px}.word{font-size:16px}.ok{color:#7cff9a;font-weight:bold}.start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#10202eee}.card{max-width:460px;margin:20px;padding:28px;border-radius:22px;background:#fff;color:#17202a;text-align:center}.btn{border:0;border-radius:14px;padding:14px 22px;background:#1976d2;color:#fff;font-size:17px;font-weight:bold}.controls{position:fixed;left:15px;bottom:65px;z-index:5;display:none}.controls button{width:52px;height:52px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:22px}.controls .row{display:flex;gap:8px}.mode{position:fixed;right:15px;bottom:125px;z-index:5;display:none;background:#000b;color:#fff;border:0;border-radius:14px;padding:10px 13px}.vr{position:fixed;right:12px;bottom:60px;z-index:5}.challenge{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:6;display:none;background:#18232bee;padding:14px 18px;border-radius:18px;text-align:center;min-width:270px;box-shadow:0 8px 28px #0007}.challenge .small{font-size:11px;text-transform:uppercase;opacity:.7}.challenge .task{font-size:20px;font-weight:bold;margin:5px 0 9px}.challenge button{border:0;border-radius:10px;padding:8px 14px;font-weight:bold}.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);z-index:7;background:#000d;padding:9px 14px;border-radius:14px;display:none}</style></head><body>
<div class="start" id="start"><div class="card"><h1>🍳 English Kitchen VR</h1><p>Explore the kitchen and practise everyday English.</p><p><b>Phone:</b> drag to look, use the movement buttons, or enable phone motion.<br><b>VR:</b> use a compatible headset/browser.</p><button class="btn" id="begin">Enter Kitchen</button></div></div>
<div class="hud"><div class="panel"><div class="title">English Kitchen VR</div><div class="word" id="prompt">Get ready!</div></div><div class="panel" id="score">⭐ 0</div></div>
<div class="challenge" id="challenge"><div class="small">English Challenge</div><div class="task" id="taskText"></div><button id="nextTask" style="display:none">Next task ▶</button></div>
<div class="controls"><button data-move="forward">▲</button><div class="row"><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div><button class="mode" id="motionBtn">📱 Phone motion</button><div class="toast" id="toast"></div><div class="vr" id="vr"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9e8);scene.fog=new THREE.Fog(0x9ec9e8,10,28);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(0,1.65,4.8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);document.getElementById('vr').appendChild(VRButton.createButton(renderer));
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.8);sun.position.set(4,7,5);sun.castShadow=true;scene.add(sun);
const interactive=[];function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.55})}function rounded(name,x,y,z,w,h,d,c,r=.08){const s=new THREE.Shape(),q=Math.min(r,w/2,h/2);s.moveTo(-w/2+q,-h/2);s.lineTo(w/2-q,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+q);s.lineTo(w/2,h/2-q);s.quadraticCurveTo(w/2,h/2,w/2-q,h/2);s.lineTo(-w/2+q,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-q);s.lineTo(-w/2,-h/2+q);s.quadraticCurveTo(-w/2,-h/2,-w/2+q,-h/2);const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:2,bevelSize:Math.min(r/2,d/4),bevelThickness:Math.min(r/2,d/4)});g.center();const m=new THREE.Mesh(g,material(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;m.userData.name=name;scene.add(m);return m}function addInteractive(m,name){m.userData.name=name;interactive.push(m);return m}function cyl(name,x,y,z,r,h,c){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),material(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;m.userData.name=name;scene.add(m);return m}
rounded('floor',0,-.08,0,10,.16,8,0xb7a38d,.03);rounded('back wall',0,2.5,-1.75,10,5,.12,0xf3eee5,.03);rounded('left wall',-4.9,2.5,0,.12,5,8,0xe4ddd0,.03);rounded('right wall',4.9,2.5,0,.12,5,8,0xe4ddd0,.03);rounded('counter',0,1,-1.2,7,.28,1.1,0xe9e1d5);rounded('cabinet run',0,.47,-1.18,7,.9,.98,0x78866c);
for(const x of[-3.05,-2.15,-1.25,-.35,.55,1.45,2.35])rounded('cabinet',x,.5,-.66,.78,.72,.05,0x879574,.05);rounded('window',2.5,2.55,-1.67,2.6,1.6,.08,0x74bce5,.05);rounded('sink',-.85,1.18,-1.22,1.55,.12,.75,0x9ca5a9,.08);
rounded('stove',1.45,1.2,-1.22,1.55,.12,.8,0x292c30,.07);for(const [x,z] of[[1.05,-1.1],[1.85,-1.1],[1.05,-1.35],[1.85,-1.35]])cyl('hob',x,1.275,z,.22,.025,0x111214);
rounded('oven body',1.45,.58,-1.02,1.55,1.05,.68,0x454a4f,.1);const ovenDoor=addInteractive(rounded('oven',1.45,.62,-.65,1.2,.58,.06,0x202427,.07),'oven');
rounded('refrigerator body',-3.15,1.7,-.48,1.42,3.2,1.3,0xdfe3e5,.12);const fridgeDoor=addInteractive(rounded('refrigerator',-3.15,1.7,.19,1.32,3.05,.08,0xf3f4f4,.1),'refrigerator');rounded('fridge handle',-2.62,1.7,.27,.07,1.55,.08,0x8e969b,.025);
const microwave=addInteractive(rounded('microwave',3.05,1.72,-1.16,1.35,.78,.68,0x41464b,.1),'microwave');const microGlass=addInteractive(rounded('microwave glass',3.05,1.72,-.81,1.02,.5,.025,0x16191b,.04),'microwave');
const coffee=addInteractive(rounded('coffee machine',-.05,1.55,-1.17,.78,.88,.62,0x25282b,.11),'coffee machine');rounded('coffee tank',.18,1.72,-.84,.25,.38,.04,0x4f5559,.03);cyl('coffee spout',-.05,1.43,-.82,.055,.24,0x969da1);
const dishwasher=addInteractive(rounded('dishwasher',-2.15,.55,-1.0,1.35,1.02,.68,0xbcc2c5,.1),'dishwasher');rounded('dishwasher panel',-2.15,.9,-.64,1.08,.12,.04,0x363b3f,.02);
rounded('table',.2,.86,1.2,3.1,.18,1.65,0x986743,.08);for(const x of[-1.1,1.1])for(const z of[.65,1.75])rounded('table leg',x,.4,z,.14,.8,.14,0x65452e,.03);
function food(name,x,y,z,c){const m=new THREE.Mesh(new THREE.SphereGeometry(.23,24,18),material(c));m.scale.set(1,.9,1);m.position.set(x,y,z);m.castShadow=true;return addInteractive(m,name)}food('apple',-.8,1.45,1.2,0xd43a32);food('orange',.25,1.43,1.22,0xf08a25);food('lemon',.65,1.42,1.2,0xe5cf28);addInteractive(cyl('cup',.05,1.3,1.2,.17,.35,0xf1f1ee),'cup');addInteractive(cyl('plate',1.35,1.3,1.5,.3,.035,0xf6f6f4),'plate');
let score=0,ovenOn=false,microOn=false,coffeeOn=false,dishOpen=false,fridgeOpen=false;const applianceNames=['oven','microwave','coffee machine','dishwasher','refrigerator'];function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
const challenge=document.getElementById('challenge'),taskText=document.getElementById('taskText'),nextTask=document.getElementById('nextTask');const tasks=[['Open the refrigerator',()=>fridgeOpen,'refrigerator'],['Close the refrigerator',()=>!fridgeOpen,'refrigerator'],['Turn on the oven',()=>ovenOn,'oven'],['Turn off the oven',()=>!ovenOn,'oven'],['Turn on the microwave',()=>microOn,'microwave'],['Turn off the microwave',()=>!microOn,'microwave'],['Make coffee',()=>coffeeOn,'coffee machine'],['Open the dishwasher',()=>dishOpen,'dishwasher'],['Close the dishwasher',()=>!dishOpen,'dishwasher']];let ti=0,active=false,done=false;function startChallenge(){active=true;done=false;nextTask.style.display='none';challenge.style.display='block';taskText.textContent=tasks[ti][0];speak(tasks[ti][0])}function checkChallenge(){if(active&&!done&&tasks[ti][1]()){done=true;score+=2;document.getElementById('score').textContent='⭐ '+score;taskText.textContent='✅ Great job!';nextTask.style.display='inline-block';speak('Great job!')}}nextTask.onclick=()=>{ti=(ti+1)%tasks.length;startChallenge()};
function interact(n){if(n==='oven'){ovenOn=!ovenOn;ovenDoor.material.emissive.set(ovenOn?0x8a2200:0);ovenDoor.material.emissiveIntensity=ovenOn?1.1:0;speak(ovenOn?'The oven is on.':'The oven is off.');toast(ovenOn?'Oven ON':'Oven OFF')}else if(n==='microwave'){microOn=!microOn;microGlass.material.emissive.set(microOn?0x164d24:0);microGlass.material.emissiveIntensity=microOn?1.1:0;speak(microOn?'The microwave is on.':'The microwave is off.');toast(microOn?'Microwave ON':'Microwave OFF')}else if(n==='coffee machine'){coffeeOn=!coffeeOn;coffee.material.emissive.set(coffeeOn?0x3b2410:0);coffee.material.emissiveIntensity=coffeeOn?.8:0;speak(coffeeOn?'The coffee machine is making coffee.':'The coffee machine is off.');toast(coffeeOn?'Making coffee ☕':'Coffee machine OFF')}else if(n==='dishwasher'){dishOpen=!dishOpen;speak(dishOpen?'The dishwasher is open.':'The dishwasher is closed.');toast(dishOpen?'Dishwasher open':'Dishwasher closed')}else if(n==='refrigerator'){fridgeOpen=!fridgeOpen;fridgeDoor.rotation.y=fridgeOpen?-0.75:0;speak(fridgeOpen?'The refrigerator is open.':'The refrigerator is closed.');toast(fridgeOpen?'Refrigerator open':'Refrigerator closed')}else{score++;document.getElementById('score').textContent='⭐ '+score;speak(n);document.getElementById('prompt').innerHTML='<span class="ok">'+n+'</span>'}setTimeout(checkChallenge,80)}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(renderer.xr.isPresenting)return;const r=renderer.domElement.getBoundingClientRect();mouse.x=e.clientX/r.width*2-1;mouse.y=-(e.clientY/r.height*2-1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(interactive,true);if(h.length)interact(h[0].object.userData.name)});
let dragging=false,lx=0,ly=0,lon=0,lat=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging||renderer.xr.isPresenting)return;lon-=(e.clientX-lx)*.25;lat-=(e.clientY-ly)*.18;lat=Math.max(-35,Math.min(35,lat));lx=e.clientX;ly=e.clientY});
const keys={forward:0,back:0,left:0,right:0};document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',()=>keys[k]=1);b.addEventListener('pointerup',()=>keys[k]=0);b.addEventListener('pointerleave',()=>keys[k]=0)});
let motion=false,lastStep=0;async function enableMotion(){try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw 0;addEventListener('devicemotion',e=>{if(!motion)return;const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x||0,a.y||0,a.z||0),now=performance.now();if(m>13&&now-lastStep>500){lastStep=now;keys.forward=1;setTimeout(()=>keys.forward=0,220)}});motion=true;document.getElementById('motionBtn').textContent='📱 Motion ON';toast('Move naturally to walk')}catch(e){toast('Motion unavailable')}}document.getElementById('motionBtn').onclick=enableMotion;
const clock=new THREE.Clock();function animate(){const dt=Math.min(clock.getDelta(),.05);if(!renderer.xr.isPresenting){camera.rotation.order='YXZ';camera.rotation.y=THREE.MathUtils.degToRad(lon);camera.rotation.x=THREE.MathUtils.degToRad(lat);const d=new THREE.Vector3((keys.right-keys.left)*2.2*dt,0,(keys.back-keys.forward)*2.2*dt);d.applyAxisAngle(new THREE.Vector3(0,1,0),camera.rotation.y);camera.position.add(d);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-4.1,4.1);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-3.5,4)}renderer.render(scene,camera)}renderer.setAnimationLoop(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('begin').onclick=()=>{document.getElementById('start').style.display='none';document.querySelector('.controls').style.display='block';document.getElementById('motionBtn').style.display='block';startChallenge()};
</script></body></html>
