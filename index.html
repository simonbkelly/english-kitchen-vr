<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Kitchen VR</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#111}#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:white}button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#fff;color:#222}#score{font-size:18px;font-weight:800;background:#222c;padding:9px 12px;border-radius:12px}.panel{position:fixed;z-index:5;top:65px;left:50%;transform:translateX(-50%);background:#17202ddd;color:white;padding:12px 16px;border-radius:16px;text-align:center;max-width:88vw}.hidden{display:none}.pad{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,58px);gap:7px}.pad button{height:52px;font-size:20px;background:#ffffffe6}.pad .empty{visibility:hidden}.hint{position:fixed;z-index:5;bottom:12px;left:12px;color:white;background:#0008;padding:8px 11px;border-radius:10px;font-size:12px}</style></head>
<body><div id="ui"><button id="challenge">🎯 Challenge</button><button id="teacher">👩‍🏫 Teacher</button><button id="vr">🥽 VR</button><span id="score">⭐ 0</span></div><div id="task" class="panel hidden"><div style="font-size:11px;opacity:.7;text-transform:uppercase">English Challenge</div><div id="taskText" style="font-size:19px;font-weight:800;margin:4px 0"></div><button id="next" class="hidden">Next task ▶</button></div><div id="teacherPanel" class="panel hidden"><b>Teacher Mode</b><br><small>Choose a vocabulary level</small><br><button data-level="easy">Easy</button> <button data-level="medium">Medium</button> <button data-level="hard">Hard</button></div><div class="pad"><span class="empty"></span><button data-move="forward">▲</button><span class="empty"></span><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div><div class="hint">Touch an object to interact • Tilt phone to move • Drag to look around</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7d8);scene.fog=new THREE.Fog(0x9ec7d8,8,28);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6b6258,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,7,3);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.15,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const wood=mat(0x9b6238,.8),cream=mat(0xe7d9bd,.9),white=mat(0xf1f1ed,.65),steel=mat(0x777b80,.3,.5),dark=mat(0x25282a,.55),green=mat(0x4c8b55,.8),red=mat(0xc94a3d,.75),yellow=mat(0xe8b84b,.75),glass=new THREE.MeshPhysicalMaterial({color:0x9bd0e8,transparent:true,opacity:.28,roughness:.1});
function box(x,y,z,w,h,d,ma,rad=.08){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);b.position.y=h/2;b.castShadow=b.receiveShadow=true;g.add(b);g.position.set(x,y,z);return g}function cyl(x,y,z,r,h,ma){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),ma);m.position.set(x,y+h/2,z);m.castShadow=true;return m}
scene.add(box(0,-.1,0,12,.2,10,wood,.02));scene.add(box(0,2.9,-5,12,6,.2,cream));scene.add(box(-5.9,1.5,0,.2,3,10,cream));scene.add(box(5.9,1.5,0,.2,3,10,cream));
// cabinets/counters
scene.add(box(-3.9,1.0,-4.2,3.2,1.8,.8,wood,.12));scene.add(box(-1.1,1.0,-4.2,2.2,1.8,.8,wood,.12));scene.add(box(1.4,1.0,-4.2,2.5,1.8,.8,wood,.12));
// fridge
const fridge=box(-4.2,0,-2.5,1.45,2.8,1.15,white,.16);scene.add(fridge);let fridgeOpen=false;const fridgeDoor=box(-3.45,.2,-2.5,.08,2.45,1.05,white,.05);scene.add(fridgeDoor);fridgeDoor.userData.action='fridge';
// oven
const oven=box(-1.5,.2,-3.65,1.65,2.0,.85,steel,.12);scene.add(oven);const ovenGlass=box(-1.5,.58,-3.2,1.35,.72,.06,glass,.03);scene.add(ovenGlass);ovenGlass.userData.action='oven';for(let i=0;i<4;i++)scene.add(cyl(-1.95+i*.3,2.25,-3.65,.1,.035,dark));let ovenOn=false;
// microwave
const micro=box(.35,1.55,-3.68,1.15,.72,.72,dark,.12);scene.add(micro);micro.userData.action='microwave';scene.add(box(.35,1.63,-3.28,.82,.48,.03,glass,.02));let microOn=false;
// dishwasher
const dish=box(2.25,.2,-3.55,1.55,1.55,.82,white,.12);scene.add(dish);const dishDoor=box(2.25,.85,-3.12,1.38,.65,.06,steel,.04);scene.add(dishDoor);dishDoor.userData.action='dishwasher';let dishOpen=false;
// coffee machine
const coffee=box(3.75,.2,-3.65,.85,1.35,.7,dark,.12);scene.add(coffee);scene.add(cyl(3.75,1.35,-3.65,.22,.12,steel));coffee.userData.action='coffee';let coffeeOn=false;
// table + proper chairs, clear of table
scene.add(box(0,.92,.7,3.3,.16,1.65,wood,.1));for(const x of [-1.45,1.45])for(const z of [.05,1.35])scene.add(cyl(x,.05,z,.09,.9,dark));
function chair(x,z,rot=0){const g=new THREE.Group();const seat=box(0,.72,0,1.0,.14,.95,wood,.12);g.add(seat);for(const sx of [-.4,.4])for(const sz of [-.35,.35])g.add(cyl(sx,.05,sz,.065,.67,dark));const back=box(0,1.15,.4,.95,.9,.12,wood,.1);g.add(back);g.position.set(x,0,z);g.rotation.y=rot;scene.add(g)}chair(-2.25,.7,0);chair(2.25,.7,Math.PI);chair(0,2.05,Math.PI);
// fruit 20% smaller
function fruit(x,z,c,r=.14){scene.add(cyl(x,1.08,z,r,.16,mat(c,.8)));}fruit(-.55,.7,red,.115);fruit(0,.7,yellow,.115);fruit(.55,.7,green,.115);fruit(-.25,1.0,red,.115);fruit(.3,1.0,yellow,.115);
// utensils + food
scene.add(cyl(-3.8,.45,-3.7,.18,.25,steel));scene.add(cyl(-3.25,.45,-3.7,.18,.25,steel));scene.add(box(-2.6,.35,-3.7,.45,.18,.35,cream,.08));
for(let i=0;i<5;i++)scene.add(cyl(2.8+i*.28,.45,-3.75,.08,.25,steel));
let score=0;function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function interact(a){if(a==='fridge'){fridgeOpen=!fridgeOpen;fridgeDoor.position.x=fridgeOpen?-2.9:-3.45;say(fridgeOpen?'Open refrigerator':'Close refrigerator')}if(a==='oven'){ovenOn=!ovenOn;say(ovenOn?'Turn on oven':'Turn off oven')}if(a==='microwave'){microOn=!microOn;say(microOn?'Turn on microwave':'Turn off microwave')}if(a==='dishwasher'){dishOpen=!dishOpen;dishDoor.rotation.x=dishOpen?-1.15:0;say(dishOpen?'Open dishwasher':'Close dishwasher')}if(a==='coffee'){coffeeOn=!coffeeOn;say(coffeeOn?'Make coffee':'Stop coffee')}finish()}
const tasks=[['Open the refrigerator',()=>fridgeOpen],['Close the refrigerator',()=>!fridgeOpen],['Turn on the oven',()=>ovenOn],['Turn off the oven',()=>!ovenOn],['Turn on the microwave',()=>microOn],['Turn off the microwave',()=>!microOn],['Make coffee',()=>coffeeOn],['Open the dishwasher',()=>dishOpen],['Close the dishwasher',()=>!dishOpen]];let ti=0,active=false,done=false;function startChallenge(){active=true;done=false;document.getElementById('task').classList.remove('hidden');document.getElementById('next').classList.add('hidden');document.getElementById('taskText').textContent=tasks[ti%tasks.length][0];say(tasks[ti%tasks.length][0])}function finish(){if(active&&!done&&tasks[ti%tasks.length][1]()){done=true;score+=2;document.getElementById('score').textContent='⭐ '+score;document.getElementById('taskText').textContent='✅ Great job!';document.getElementById('next').classList.remove('hidden');say('Great job!')}}document.getElementById('challenge').onclick=startChallenge;document.getElementById('next').onclick=()=>{ti++;startChallenge()};document.getElementById('teacher').onclick=()=>document.getElementById('teacherPanel').classList.toggle('hidden');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{say(b.textContent+' level selected');document.getElementById('teacherPanel').classList.add('hidden')});
// touch / mouse interaction
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();function hit(e){const r=renderer.domElement.getBoundingClientRect();pt.x=((e.clientX-r.left)/r.width)*2-1;pt.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pt,camera);const o=ray.intersectObjects(scene.children,true).find(x=>x.object.userData.action);if(o)interact(o.object.userData.action)}renderer.domElement.addEventListener('pointerdown',hit);
// 4-direction movement
const move={forward:false,back:false,left:false,right:false};document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;const on=e=>{e.preventDefault();move[k]=true},off=e=>{e.preventDefault();move[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off)});let tilt={x:0,y:0};function motion(e){tilt.x=e.accelerationIncludingGravity?.x||0;tilt.y=e.accelerationIncludingGravity?.y||0}if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){renderer.domElement.addEventListener('dblclick',()=>DeviceMotionEvent.requestPermission().then(x=>{if(x==='granted')window.addEventListener('devicemotion',motion)}))}else window.addEventListener('devicemotion',motion);
let dragging=false,lastX=0,lastY=0,yaw=0,pitch=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.target===renderer.domElement){dragging=true;lastX=e.clientX;lastY=e.clientY}});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.003;pitch=Math.max(-.8,Math.min(.8,pitch));lastX=e.clientX;lastY=e.clientY});
function loop(){requestAnimationFrame(loop);const s=.045;let dx=0,dz=0;if(move.forward||tilt.y< -7)dz-=s;if(move.back||tilt.y>7)dz+=s;if(move.left||tilt.x< -4)dx-=s;if(move.right||tilt.x>4)dx+=s;camera.position.x+=dx;camera.position.z+=dz;camera.position.x=Math.max(-5.2,Math.min(5.2,camera.position.x));camera.position.z=Math.max(-4.4,Math.min(4.4,camera.position.z));camera.rotation.set(pitch,yaw,0,'YXZ');renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
