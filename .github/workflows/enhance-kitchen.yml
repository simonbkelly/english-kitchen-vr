name: Enhance English Kitchen
on:
  push:
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

jobs:
  enhance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add natural landscape phone motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          marker='<button id="vr" class="topbtn">🥽 VR</button>'
          if 'id="motion"' not in s and marker in s:
              s=s.replace(marker, marker+'<button id="motion" class="topbtn">📳 Motion</button>',1)

          anchor='let vr=false;document.getElementById(\'vr\').onclick=async()=>{'
          motion=r'''let motionEnabled=false,motionGamma=0,motionBeta=0;
          function updateMotion(e){
            if(e.gamma==null||e.beta==null)return;
            const a=((screen.orientation&&screen.orientation.angle)||window.orientation||0)+360;
            let sx,sy;
            if(a%360===90){sx=-e.beta;sy=e.gamma}
            else if(a%360===270){sx=e.beta;sy=-e.gamma}
            else{sx=e.gamma;sy=e.beta}
            const dead=7;
            motionGamma=Math.abs(sx)>dead?Math.max(-1,Math.min(1,sx/25)):0;
            motionBeta=Math.abs(sy)>dead?Math.max(-1,Math.min(1,sy/25)):0;
          }
          async function enableMotion(){
            try{
              if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
                const p=await DeviceOrientationEvent.requestPermission();
                if(p!=='granted')throw new Error('permission denied');
              }
              window.addEventListener('deviceorientation',updateMotion,true);
              motionEnabled=true;
              document.getElementById('motion').textContent='📳 Motion ON';
              say('Phone motion on');
            }catch(e){say('Phone motion permission was not granted')}
          }
          if(document.getElementById('motion'))document.getElementById('motion').onclick=enableMotion;
          '''
          if 'function updateMotion(e)' not in s and anchor in s:
              s=s.replace(anchor,motion+anchor,1)

          old='const speed=.045;let dx=0,dz=0;if(move.forward)dz-=speed;if(move.back)dz+=speed;if(move.left)dx-=speed;if(move.right)dx+=speed;'
          new='const speed=.045;let dx=0,dz=0;if(move.forward)dz-=speed;if(move.back)dz+=speed;if(move.left)dx-=speed;if(move.right)dx+=speed;if(motionEnabled){dz-=speed*motionGamma;dx+=speed*motionBeta;}'
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Make arrow controller 30 percent smaller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('grid-template-columns:58px 58px 58px;grid-template-rows:52px 52px 52px;gap:7px', 'grid-template-columns:41px 41px 41px;grid-template-rows:36px 36px 36px;gap:5px')
          s=s.replace('.move{border:0;border-radius:15px;background:#ffffffe8;color:#18212b;font-size:25px;', '.move{border:0;border-radius:11px;background:#ffffffe8;color:#18212b;font-size:18px;')
          s=s.replace('.move{width:56px;height:50px}', '.move{width:39px;height:35px}')
          p.write_text(s)
          PY
      - name: Make table food visually distinct
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='function fruit(x,z,c,r=.115){scene.add(cyl(x,1.08,z,r,.16,mat(c,.8)));}fruit(-.55,.7,red);fruit(0,.7,yellow);fruit(.55,.7,green);fruit(-.25,1,red);fruit(.3,1,yellow);'
          new=r'''function foodSphere(x,z,color,sx=1,sy=1,sz=1){
            const m=new THREE.Mesh(new THREE.SphereGeometry(.14,24,16),mat(color,.8));
            m.position.set(x,1.08,z);m.scale.set(sx,sy,sz);m.castShadow=true;scene.add(m);return m;
          }
          function foodStem(x,z,h=.08){scene.add(cyl(x,1.20,z,.025,h,dark));}
          // Orange: round orange fruit
          foodSphere(-.55,.7,0xf28c28,1,1,1);
          // Apple: red, slightly squat, with a stem
          foodSphere(0,.7,0xd9362e,1.05,.9,1.05);foodStem(0,.7,.09);
          // Banana: curved yellow shape
          const banana=new THREE.Mesh(new THREE.TorusGeometry(.17,.045,12,24,Math.PI*1.25),mat(0xf4d35e,.75));
          banana.rotation.set(0,0,-.45);banana.position.set(.55,1.10,.7);banana.castShadow=true;scene.add(banana);
          // Pear: green with a narrower top
          foodSphere(-.25,1,0x9fbe45,.95,1.15,.95);foodStem(-.25,1,.07);
          // Tomato: round red vegetable with a green top
          foodSphere(.3,1,0xe64a35,1.05,.95,1.05);
          const tomatoTop=new THREE.Mesh(new THREE.ConeGeometry(.07,.05,6),mat(0x4c8b55,.8));
          tomatoTop.position.set(.3,1.24,1);tomatoTop.rotation.x=Math.PI;scene.add(tomatoTop);'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make table food shapes and colours distinct' && git push
